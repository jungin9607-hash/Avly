
services:
  frontend:
    build:
      context: ./frontend
    container_name: avly_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: avly_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: avly_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: avly
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: avly_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avly -d avly_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
