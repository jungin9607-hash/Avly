services:
  db:
    image: postgres:17-alpine
    container_name: avly_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: avly
      POSTGRES_DB: avly
    volumes:
      - avly_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d avly"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: avly_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    # DB 주소는 backend/.env 의 DATABASE_URL 을 그대로 쓴다. 팀 공용 DB 또는 compose 의 로컬 db 서비스 중 .env 에 적은 쪽에 연결된다.
    #   (AUTO_MIGRATE 를 정하지 않으면: 로컬 db 서비스(호스트 이름 db)일 때만 시작할 때 스키마를 만든다. 공용 DB 는 바꾸지 않는다)
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      args:
        INSTALL_YOLO: ${INSTALL_YOLO:-false}
    container_name: avly_worker
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      # 개발 기본값: AI 키 없이 전체 흐름을 시험하는 가짜 엔진, 가리지 않는 복사.
      # 실제 분석은 ENGINE=avly (OPENAI_API_KEY 필요), 운영 비식별은 REDACTION=yolo (INSTALL_YOLO=true 로 빌드)
      ENGINE: ${ENGINE:-fake}
      REDACTION: ${REDACTION:-dev_copy}
      CASE_COMPARE: ${CASE_COMPARE:-auto}   # 판례 비교: auto(실제 엔진 + OpenAI 키가 있으면 AI) | ai | rule
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: avly_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./docs/review/review.html:/review/review.html:ro   # 검수 페이지를 http://localhost:5173/review.html 로 연다(개발 서버 전용)
    depends_on:
      - backend

volumes:
  avly_db:
